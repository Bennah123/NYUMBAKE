<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — NYUMBAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="wrap" style="max-width:420px; padding-top:80px;">
  <header class="masthead">
    <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>NYUMBA<span>KE</span></div>
  </header>

  <h1 style="font-size:24px">Set a new password</h1>
  <p class="lede">You followed a reset link from your email — pick a new password below.</p>

  <div id="status" class="status-msg" style="display:none"></div>

  <div id="form-wrap" class="panel">
    <label for="new_password">New password</label>
    <input type="text" id="new_password" placeholder="At least 8 characters" style="-webkit-text-security:disc; text-security:disc">
    <div class="actions">
      <button type="button" class="primary" id="save-password">Save new password</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js';

  const statusEl = document.getElementById('status');
  const showStatus = (msg, type) => {
    statusEl.textContent = msg;
    statusEl.className = `status-msg ${type}`;
    statusEl.style.display = 'block';
  };

  // Supabase puts the recovery session in the URL fragment; getSession()
  // picks it up automatically once the client initializes.
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    document.getElementById('form-wrap').style.display = 'none';
    showStatus('This reset link is invalid or has expired — request a new one from the login page.', 'error');
  }

  document.getElementById('save-password').addEventListener('click', async () => {
    const password = document.getElementById('new_password').value;
    if (password.length < 8) return showStatus('Password must be at least 8 characters.', 'error');

    const { error } = await supabase.auth.updateUser({ password });
    if (error) return showStatus(error.message, 'error');

    showStatus('Password updated — redirecting you to log in…', 'ok');
    setTimeout(() => { window.location.href = 'tenant-signup.html'; }, 1500);
  });
</script>
</body>
</html>
